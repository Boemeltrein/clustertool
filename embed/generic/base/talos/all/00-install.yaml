apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  # The schematic ID in this URL selects the image's extensions and kernel arguments.
  # ../schematic.yaml records the Image Factory input; genconfig/apply do not process it.
  # After changing it, register it with Image Factory and replace the ID below.
  # Existing nodes need an image upgrade to activate these changes; apply is not enough.
  # See docs/native-talos.md for registration and upgrade instructions.
  image: factory.talos.dev/metal-installer/4c4acaf75b4a51d6ec95b38dc8b49fb0af5f699e7fbd12fbf246821c649b5312:v1.14.0
provisioning:
  diskSelector:
    # Exclude loop devices and installation media. Refine this to the intended
    # disk's serial or dev_path when more than one writable disk matches.
    match: disk.size <= 1600u * GB && disk.transport != "" && !disk.readonly && !disk.cdrom && !disk.dev_path.startsWith("/dev/loop")
  wipe: false
